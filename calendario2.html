<div class="card">
    <h2>💧 Calculadora de Riego</h2>

    <label>Cantidad de plantas:</label>
    <input type="number" id="plantas" placeholder="Ej: 5">

    <label>Clima:</label>
    <select id="clima">
        <option value="1">Normal</option>
        <option value="1.5">Caluroso</option>
        <option value="0.7">Húmedo</option>
    </select>

    <button onclick="calcularRiego()">Calcular</button>

    <p id="resultado"></p>
